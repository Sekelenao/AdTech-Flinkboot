<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="subHeader" class="sub-header-bar">
        <div class="sub-header-container">
            <ul class="sub-nav-menu">
                <li class="sub-nav-item">
                    <a th:href="@{/alerts}"
                       th:classappend="${activeMenu == 'ALERTS'} ? 'active' : ''"
                       class="sub-nav-link">
                        ALERTS
                    </a>
                </li>
                <li class="sub-nav-item">
                    <a th:href="@{/campaigns/status/PAUSED}"
                       th:classappend="${activeMenu == 'PAUSED'} ? 'active' : ''"
                       class="sub-nav-link">
                        <span class="status-dot gray"></span> PAUSED
                    </a>
                </li>
                <li class="sub-nav-item">
                    <a th:href="@{/campaigns/status/ACTIVE}"
                       th:classappend="${activeMenu == 'ACTIVE'} ? 'active' : ''"
                       class="sub-nav-link">
                        <span class="status-dot green"></span> ACTIVE
                    </a>
                </li>
                <li class="sub-nav-item">
                    <a th:href="@{/campaigns/status/CAPPED}"
                       th:classappend="${activeMenu == 'CAPPED'} ? 'active' : ''"
                       class="sub-nav-link">
                        <span class="status-dot red"></span> CAPPED
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</body>
</html>
