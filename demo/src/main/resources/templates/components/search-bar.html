<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="searchBar" class="search-bar-wrapper">
        <form th:action="@{/campaigns/search}" method="get" class="search-form">
            <div class="search-input-group">
                <span class="search-icon">&#x1F50D;</span>
                <input type="search"
                       name="campaignId"
                       class="search-input"
                       placeholder="Search campaign by ID (e.g. cmp-google-pixel9)..."
                       autocomplete="off"
                       th:value="${campaignId != null ? campaignId : ''}">
                <button type="submit" class="btn btn-primary search-btn">Lookup</button>
                <a th:if="${campaignId != null}"
                   th:href="@{/alerts}"
                   class="btn btn-secondary clear-btn"
                   title="Clear search">
                    Clear
                </a>
            </div>
        </form>
    </div>
</body>
</html>
