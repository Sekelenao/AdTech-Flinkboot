<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flinkboot ADS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header th:replace="~{components/header :: header}"></header>
    <nav th:replace="~{components/sub-header :: subHeader}"></nav>

    <main class="dashboard-container">
        <div th:replace="~{components/notifications :: notifications}"></div>

        <!-- ALERTS Menu (default view): Search bar + Alerts list -->
        <th:block th:if="${param.status == null or param.status[0] == 'ALERTS'}">
            <!-- Search bar proposing all known contracts -->
            <div th:replace="~{components/search-bar :: searchBar}"></div>

            <!-- Alerts list -->
            <section th:replace="~{components/alert-list :: alertList}"></section>
        </th:block>

        <!-- Status Menus (PAUSED, ACTIVE, CAPPED): Campaigns table -->
        <th:block th:if="${param.status != null and param.status[0] != 'ALERTS'}">
            <section th:replace="~{components/budget-table :: budgetTable}"></section>
        </th:block>
    </main>
</body>
</html>
