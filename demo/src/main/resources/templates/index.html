<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flinkboot ADS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header th:replace="~{components/header :: header}"></header>
    <nav th:replace="~{components/sub-header :: subHeader}"></nav>

    <main class="dashboard-container">
        <div th:replace="~{components/notifications :: notifications}"></div>

        <!-- ALERTS View: Search bar + Alerts list -->
        <th:block th:if="${alerts != null}">
            <div th:replace="~{components/search-bar :: searchBar}"></div>
            <section th:replace="~{components/alert-list :: alertList}"></section>
        </th:block>

        <!-- CAMPAIGNS View (by status or by search): Search bar (if searched) + Budget table -->
        <th:block th:if="${campaigns != null}">
            <div th:if="${campaignId != null}" th:replace="~{components/search-bar :: searchBar}"></div>
            <section th:replace="~{components/budget-table :: budgetTable}"></section>
        </th:block>
    </main>
</body>
</html>
