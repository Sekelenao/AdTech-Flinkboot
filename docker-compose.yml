services:
  zookeeper:
    image: zookeeper:3.9.2
    container_name: adtech-zookeeper
    environment:
      ZOO_MY_ID: 1
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  coordinator-server:
    image: apache/fluss:1.0.0
    container_name: adtech-fluss-coordinator
    command: coordinatorServer
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://coordinator-server:0, CLIENT://coordinator-server:9123
        advertised.listeners: CLIENT://localhost:9123
        internal.listener.name: INTERNAL
        remote.data.dir: /tmp/fluss/remote-data
    ports:
      - "9123:9123"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/coordinator-server/9123 && exec 3<&- && exec 3>&-"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  tablet-server:
    image: apache/fluss:1.0.0
    container_name: adtech-fluss-tablet
    command: tabletServer
    depends_on:
      coordinator-server:
        condition: service_healthy
    environment:
      READINESS_TCP_HOST: tablet-server
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://tablet-server:0, CLIENT://tablet-server:9124
        advertised.listeners: CLIENT://localhost:9124
        internal.listener.name: INTERNAL
        tablet-server.id: 1
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
    ports:
      - "9124:9124"
    healthcheck:
      test: ["CMD", "bash", "/opt/fluss/bin/readiness-check.sh"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  init-fluss:
    image: apache/fluss-quickstart-flink:1.20-1.0.0
    container_name: adtech-init-fluss
    depends_on:
      coordinator-server:
        condition: service_healthy
      tablet-server:
        condition: service_healthy
    network_mode: host
    entrypoint: [ '/bin/bash', '-c' ]
    command: |
      "
      cat << 'EOF' > /tmp/init-fluss.sql
      CREATE CATALOG IF NOT EXISTS fluss WITH (
          'type' = 'fluss',
          'bootstrap.servers' = 'localhost:9123'
      );
      USE CATALOG fluss;
      CREATE TABLE IF NOT EXISTS campaign_live_budgets (
          campaign_id STRING,
          advertiser_id STRING,
          status STRING,
          allocated_budget BIGINT,
          spent_budget BIGINT,
          remaining_budget BIGINT,
          impression_count BIGINT,
          click_count BIGINT,
          attributed_conversion_count BIGINT,
          attributed_revenue BIGINT,
          last_update_time BIGINT,
          PRIMARY KEY (campaign_id) NOT ENFORCED
      );
      EOF
      echo 'Waiting for Fluss cluster to be ready for table initialization...'
      until /opt/flink/bin/sql-client.sh -f /tmp/init-fluss.sql; do
        echo 'Fluss coordinator not leader yet or cluster initializing, retrying in 2 seconds...'
        sleep 2
      done
      echo 'All Fluss tables created successfully!'
      "

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: adtech-redpanda
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: adtech-init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Redpanda to be ready...'
      while ! rpk cluster info --brokers redpanda:29092 > /dev/null 2>&1; do
        sleep 0.5
      done
      echo 'Redpanda is ready. Creating topics...'
      rpk topic create campaign_budgets ad_impressions ad_clicks conversions budget_alerts attributed_conversions -p 3 -r 1 --brokers redpanda:29092
      echo 'All topics created successfully!'
      "

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: adtech-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8085:8080"

  budget-job:
    image: eclipse-temurin:11-jre
    container_name: adtech-budget-job
    volumes:
      - .:/app:ro
    working_dir: /app
    command: [
      "java",
      "-Xms256m",
      "-Xmx512m",
      "-cp",
      "budget/target/classes:model/target/classes:budget/target/dependency/*",
      "io.github.sekelenao.adtech.budget.BudgetJob"
    ]
    depends_on:
      init-fluss:
        condition: service_completed_successfully
      init-topics:
        condition: service_completed_successfully
    network_mode: host
    profiles: [ "jobs", "full" ]

  attribution-job:
    image: eclipse-temurin:11-jre
    container_name: adtech-attribution-job
    volumes:
      - .:/app:ro
    working_dir: /app
    command: [
      "java",
      "-Xms256m",
      "-Xmx512m",
      "-cp",
      "attribution/target/classes:model/target/classes:attribution/target/dependency/*",
      "io.github.sekelenao.adtech.attribution.AttributionJob"
    ]
    depends_on:
      init-fluss:
        condition: service_completed_successfully
      init-topics:
        condition: service_completed_successfully
    network_mode: host
    profiles: [ "jobs", "full" ]

  demo:
    image: eclipse-temurin:25-jre-noble
    container_name: adtech-demo-app
    volumes:
      - .:/app:ro
    working_dir: /app
    command: [
      "java",
      "-Xms256m",
      "-Xmx512m",
      "--enable-native-access=ALL-UNNAMED",
      "-cp",
      "demo/target/classes:model/target/classes:demo/target/dependency/*",
      "io.github.sekelenao.demo.DemoApplication"
    ]
    depends_on:
      budget-job:
        condition: service_started
      attribution-job:
        condition: service_started
    network_mode: host
    profiles: [ "app", "full" ]

